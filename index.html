<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121820"><title>Cavany • Gestão de Motel</title><style>
:root{--bg:#f4f5f7;--ink:#212a36;--muted:#7e8796;--line:#e7e9ee;--accent:#d65d3c;--green:#258268;--side:#151b24}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}button,a{ -webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 15px;font-weight:600}button:hover{filter:brightness(.97)}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:#bc4343}button.small{padding:7px 10px;font-size:12px}button.ghost{background:transparent;color:inherit;border-color:#ffffff28}input,select,textarea{padding:11px;border:1px solid #dce0e6;border-radius:8px;width:100%;background:white;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #e8ab93}textarea{resize:vertical}label{display:block;font-size:12px;font-weight:650;margin:15px 0 6px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.8px}h2{font-size:19px}h3{font-size:15px}small,.muted{color:var(--muted)}aside{position:fixed;left:0;top:0;bottom:0;width:228px;background:var(--side);color:#c4cad4;padding:28px 18px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:10px;color:white;padding:0 7px 27px}.brand img{width:45px;height:45px;border-radius:50%;object-fit:cover}.brand strong{font-size:19px;letter-spacing:1.5px}.brand span{font-size:10px;letter-spacing:2px;color:#9099a8}nav{display:grid;gap:6px}.navbtn{text-align:left;border:0;background:none;color:#a9b2c0;font-weight:500;padding:13px 14px;display:flex;gap:12px;align-items:center}.navbtn.active{background:#ffffff0c;color:white;border-left:3px solid var(--accent);border-radius:7px}.navbtn svg{width:19px;height:19px}.asidefoot{margin-top:auto;font-size:11px;padding:16px 12px;border-top:1px solid #fffff oom .top{display:flex;justify-content:space-between;align-items:center}.roomno{font-size:27px;letter-spacing:-1px;font-weight:650}.roomcat{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:10px;font-weight:650;border-radius:5px;padding:5px 8px;color:#278064;background:#e8f5ef;white-space:nowrap}.badge.ocupada{color:#bd6940;background:#fff0e6}.badge.limpeza{color:#5278b3;background:#edf2fc}.badge.manutencao{color:#937548;background:#f7f0e1}.roominfo{margin-top:24px;display:flex;justify-content:space-between;gap:10px;align-items:end}.roominfo strong{font-size:17px;font-weight:650}.roominfo small{display:block;font-size:11px;margin-bottom:6px}.roomfoot{border-top:1px solid var(--line);margin-top:17px;padding-top:12px;font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}.room:before{content:'';position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:4px;background:#80bca9}.room.ocupada:before{background:#e4a071}.room.limpeza:before{background:#83a6da}.room.manutencao:before{background:#c4aa81}.twocol{display:grid;grid-template-columns:1.8fr 1fr;gap:20px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th{text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:13px 12px;background:#f9fafb}td{padding:15px 12px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}tr:last-child td{border:0}.empty{text-align:center;padding:50px 20px;color:var(--muted);line-height:1.9}.notice{padding:13px 16px;border:1px solid #eddfca;border-radius:9px;background:#fffaf0;font-size:12px;line-height:1.6;margin-bottom:18px;color:#866749}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}.modalback{display:none;position:fixed;inset:0;z-index:30;background:#10192388;backdrop-filter:blur(3px);padding:25px;align-items:center;justify-content:center}.modalback.show{display:flex}.modal{width:570px;max-width:100%;max-height:93vh;overflow:auto;background:#fff;border-radius:17px;padding:27px;box-shadow:0 24px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead button{border:0;background:#f3f4f7;padding:5px 10px;font-size:20px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.line{display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:13px}.total{padding:16px;background:#f8f5f1;border-radius:8px;margin:18px 0}.total strong{font-size:25px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chart{height:165px;display:flex;align-items:end;gap:12px;padding:15px 0 23px}.bar{flex:1;min-height:3px;background:#d97354;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;font-size:9px;color:var(--muted);left:50%;transform:translateX(-50%)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1d2b38;color:white;border-radius:9px;padding:14px 20px;z-index:80;max-width:90%;box-shadow:0 5px 30px #0003;display:none}.menu{display:none}.footer{color:var(--muted);font-size:11px;margin-top:25px}.receipt{font-family:monospace;color:black;background:white;padding:10px;font-size:12px;line-height:1.7}.receipt h3{text-align:center;font-size:16px}.receipt .sep{border-top:1px dashed #333;margin:13px 0}.receipt .line{font-size:11px;margin:7px 0}.receipt .center{text-align:center}#printarea{display:none}@media(min-width:1450px){.rooms{grid-template-columns:repeat(4,1fr)}}@media(max-width:1100px){.rooms{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}@media(max-width:760px){aside{transform:translateX(-100%);transition:transform .2s;width:228px}aside.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0006}main{margin:0}.topbar{padding:0 18px;height:65px}.topbar .right{gap:8px}.topbar .operator{display:none}.menu{display:block;border:0;padding:5px}.workspace{padding:23px 16px}.pagehead{align-items:start}h1{font-size:24px}.metrics{gap:10px}.metric{padding:16px}.metric .value{font-size:23px}.panel{padding:16px}.rooms{gap:10px}.room{padding:16px}.roomno{font-size:23px}.roominfo{margin-top:18px}.roominfo strong{font-size:15px}.roomfoot{font-size:10px}.badge{font-size:9px;padding:4px 6px}.search{width:100%;margin:5px 0}.modalback{padding:12px}.modal{padding:20px}.formgrid{gap:0 12px}.clockdate{display:none}}@media(max-width:380px){.rooms{grid-template-columns:1fr}}@media print{body>*{display:none!important}#printarea{display:block!important;margin:0;width:var(--paper,80mm);max-width:100%}@page{margin:3mm}#printarea .receipt{padding:0}.receipt .line{font-size:10px}}
</style></head><body><aside id="sidebar"><div class="brand"><img src="./logo.jpg" alt="Logo do motel"><div><strong>CAVANY</strong><br><span>GESTÃO DE MOTEL</span></div></div><nav id="nav"></nav><div class="asidefoot">OPERAÇÃO DO MOTEL<b id="shiftlabel">Carregando…</b><span id="sidelabel">Recepção</span></div></aside><main><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Abrir menu">☰</button><span class="muted">Painel de gestão <span class="clockdate">/ <b id="crumb" style="color:#465264">Visão geral</b></span></span></div><div class="right"><span class="online" id="sync"><i class="dot"></i>Conectando</span><span class="operator muted" id="clock"></span><span class="avatar">C</span></div></header><div class="workspace" id="app"><div class="empty">Carregando seu painel…</div></div></main><div id="modalback" class="modalback"><section role="dialog" aria-modal="true" aria-labelledby="mtitle" class="modal"><div class="modalhead"><h2 id="mtitle"></h2><button onclick="closeModal()" aria-label="Fechar">×</button></div><div id="mbody"></div></section></div><div class="toast" id="toast" role="status"></div><div id="printarea"></div><script src="./app.js"></script></body></html>
